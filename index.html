<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wolf Insights — Regulatory Intelligence Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Official Supabase JS v2 SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

  <!-- ==================== 1. LOGIN / SIGNUP SCREEN ==================== -->
  <div id="authScreen" class="min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl space-y-6">
      <div class="text-center space-y-2">
        <span class="text-xs bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full font-semibold border border-emerald-500/20">
          ⚡ Wolf Insights V2
        </span>
        <h1 class="text-2xl font-bold tracking-tight">Terminal Access</h1>
        <p class="text-slate-400 text-sm">Sign in to access Indian renewable energy policy intelligence.</p>
      </div>

      <!-- Error / Status Message -->
      <div id="authMessage" class="hidden text-xs p-3 rounded-lg bg-red-500/10 border border-red-500/30 text-red-400"></div>

      <form id="authForm" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Work Email</label>
          <input type="email" id="emailInput" required placeholder="founder@company.com"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-emerald-500" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Password</label>
          <input type="password" id="passwordInput" required placeholder="••••••••"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-emerald-500" />
        </div>

        <div class="flex gap-3 pt-2">
          <button type="submit" id="loginBtn"
            class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold py-3 rounded-xl transition-colors">
            Log In
          </button>
          <button type="button" id="signupBtn"
            class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-semibold py-3 rounded-xl border border-slate-700 transition-colors">
            Create Account
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ==================== 2. MAIN DASHBOARD SCREEN ==================== -->
  <div id="dashboardScreen" class="hidden min-h-screen flex flex-col">
    <!-- Top Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/70 backdrop-blur px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-emerald-400 font-bold text-lg">⚡ Wolf Insights</span>
        <span id="planBadge" class="text-xs uppercase font-bold px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700">
          FREE TIER
        </span>
      </div>

      <div class="flex items-center gap-4">
        <span id="userEmailDisplay" class="text-xs text-slate-400 hidden sm:inline"></span>
        <button id="logoutBtn" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700">
          Log Out
        </button>
      </div>
    </header>

    <!-- Dashboard Main Content -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-6 space-y-8">
      <!-- Ask Bar Section -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4 shadow-xl">
        <div class="flex items-center justify-between">
          <h2 class="text-base font-semibold text-slate-100">Ask Wolf Regulatory AI</h2>
          <span class="text-xs text-slate-500">Grounded in live MNRE & CERC data</span>
        </div>

        <form id="askForm" class="relative flex items-center">
          <input type="text" id="userQuery" required
            placeholder="Ask about ISTS waivers, banking charges, or solar tariffs..."
            class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3.5 pl-4 pr-28 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500" />
          <button type="submit" id="askBtn"
            class="absolute right-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-4 py-2 rounded-lg">
            Ask AI
          </button>
        </form>

        <!-- AI Response Box -->
        <div id="responseContainer" class="hidden bg-slate-950 border border-emerald-500/30 rounded-xl p-5 space-y-3">
          <div class="text-xs font-semibold text-emerald-400 uppercase tracking-wider">⚡ Intelligence Briefing</div>
          <div id="aiAnswer" class="text-sm text-slate-300 leading-relaxed whitespace-pre-line"></div>
        </div>
      </div>

      <!-- Recent Scraped Policies Feed -->
      <div class="space-y-3">
        <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Latest Regulatory Feed</h3>
        <div id="policiesList" class="space-y-3">
          <div class="text-xs text-slate-500">Loading policies from Supabase...</div>
        </div>
      </div>
    </main>
  </div>

  <!-- ==================== 3. SUPABASE AUTH & DASHBOARD LOGIC ==================== -->
  <script>
    // REPLACE THESE TWO WITH YOUR SUPABASE PROJECT URL & ANON KEY
    const SUPABASE_URL = "https://axiatcsrztztcvcqhwcm.supabase.co/rest/v1/";
    const SUPABASE_ANON_KEY = "sb_secret_2jcM-xXMP1tWT3c8030dyA_lrEVR5Rc";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const authScreen = document.getElementById("authScreen");
    const dashboardScreen = document.getElementById("dashboardScreen");
    const authMessage = document.getElementById("authMessage");

    function showAuthMessage(msg, isError = true) {
      authMessage.textContent = msg;
      authMessage.className = `text-xs p-3 rounded-lg border ${
        isError
          ? "bg-red-500/10 border-red-500/30 text-red-400"
          : "bg-emerald-500/10 border-emerald-500/30 text-emerald-400"
      }`;
      authMessage.classList.remove("hidden");
    }

    // 1. Handle Log In
    document.getElementById("authForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("emailInput").value.trim();
      const password = document.getElementById("passwordInput").value;

      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) showAuthMessage(error.message, true);
    });

    // 2. Handle Sign Up
    document.getElementById("signupBtn").addEventListener("click", async () => {
      const email = document.getElementById("emailInput").value.trim();
      const password = document.getElementById("passwordInput").value;
      if (!email || !password) return showAuthMessage("Enter an email and password first.");

      const { error } = await sb.auth.signUp({ email, password });
      if (error) {
        showAuthMessage(error.message, true);
      } else {
        showAuthMessage("Account created! Logging you into the terminal...", false);
      }
    });

    // 3. Handle Log Out
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await sb.auth.signOut();
    });

    // 4. Listen for Login/Logout State Changes Automatically
    sb.auth.onAuthStateChange(async (event, session) => {
      if (session && session.user) {
        authScreen.classList.add("hidden");
        dashboardScreen.classList.remove("hidden");
        document.getElementById("userEmailDisplay").textContent = session.user.email;
        await loadUserProfile(session.user.id);
        await loadRecentPolicies();
      } else {
        dashboardScreen.classList.add("hidden");
        authScreen.classList.remove("hidden");
      }
    });

    // 5. Load User Subscription Plan ('free' vs 'pro')
    async function loadUserProfile(userId) {
      const { data } = await sb.from("profiles").select("plan_tier").eq("id", userId).single();
      const tier = data?.plan_tier || "free";
      window.userPlanTier = tier;

      const badge = document.getElementById("planBadge");
      if (tier === "pro") {
        badge.textContent = "WOLF PRO";
        badge.className = "text-xs uppercase font-bold px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/40";
      } else {
        badge.textContent = "FREE TIER";
      }
    }

    // 6. Load Scraped Policies from Supabase
    async function loadRecentPolicies() {
      const list = document.getElementById("policiesList");
      const { data: policies, error } = await sb
        .from("policies")
        .select("source, title, ai_summary")
        .limit(10);

      if (error || !policies?.length) {
        list.innerHTML = `<div class="text-xs text-slate-500">No policies found yet. Run your scraper or check table permissions.</div>`;
        return;
      }

      list.innerHTML = policies.map(p => `
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-1.5">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-emerald-400">${p.source || "REGULATORY"}</span>
          </div>
          <h4 class="text-sm font-semibold text-slate-200">${p.title}</h4>
          <p class="text-xs text-slate-400 leading-relaxed">${p.ai_summary || ""}</p>
        </div>
      `).join("");
    }

    // 7. Ask Bar Query (Points to your Flask server or Edge Function)
    document.getElementById("askForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const query = document.getElementById("userQuery").value.trim();
      const btn = document.getElementById("askBtn");
      const box = document.getElementById("responseContainer");
      const ans = document.getElementById("aiAnswer");

      btn.textContent = "Analyzing...";
      btn.disabled = true;
      box.classList.remove("hidden");
      ans.textContent = "Fetching regulatory context and running Gemini analysis...";

      try {
        const res = await fetch("http://localhost:5000/api/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query })
        });
        const data = await res.json();
        ans.textContent = res.ok ? data.answer : ("Error: " + data.error);
      } catch (err) {
        ans.textContent = "Backend server offline. Start server.py or connect your Supabase Edge Function.";
      } finally {
        btn.textContent = "Ask AI";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
