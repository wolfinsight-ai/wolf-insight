name: Daily Policy Auto-Scraper
on:
  schedule:
    - cron: '30 2 * * *' # Runs every morning at 8:00 AM IST
  workflow_dispatch: # Lets you trigger it manually with 1 click

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests beautifulsoup4 google-genai pydantic supabase
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scraper.py
